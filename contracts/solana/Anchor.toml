[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
tenda_escrow = "996SiTqTBhydHAsTqt1vDn9sP5uW6Q9RUrc4ZdNcHyyv"

[programs.localnet]
tenda_escrow = "996SiTqTBhydHAsTqt1vDn9sP5uW6Q9RUrc4ZdNcHyyv"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 120000 \"tests/**/*.test.ts\""
test-devnet = "pnpm exec ts-mocha -p ./tsconfig.json -t 600000 \"tests-devnet/**/*.test.ts\""
